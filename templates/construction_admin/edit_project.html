<!DOCTYPE html>
<html lang="en-QA">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Edit Project | Prestigious Trading & Construction
    </title>

    <style>

        :root {

            --primary: #3F6B57;
            --dark: #234236;
            --accent: #8BAF8B;
            --light: #F4F8F4;
            --text: #24352D;
            --secondary: #687A70;
            --border: #DCE7DE;

        }


        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            padding: 40px;

            background: var(--light);

            font-family:
                Arial,
                sans-serif;

            color: var(--text);

        }


        .container {

            max-width: 900px;

            margin: auto;

        }


        .header {

            background: white;

            border: 1px solid var(--border);

            border-radius: 14px;

            padding: 28px;

            margin-bottom: 25px;

        }


        .header h1 {

            margin: 0 0 8px;

            color: var(--primary);

        }


        .header p {

            margin: 0;

            color: var(--secondary);

        }


        .form-card {

            background: white;

            border: 1px solid var(--border);

            border-radius: 14px;

            padding: 30px;

        }


        .form-grid {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 20px;

        }


        .form-group {

            display: flex;

            flex-direction: column;

        }


        .full {

            grid-column: 1 / -1;

        }


        label {

            font-size: 13px;

            font-weight: 700;

            margin-bottom: 7px;

            color: var(--dark);

        }


        input,
        select,
        textarea {

            width: 100%;

            padding: 12px 13px;

            border: 1px solid var(--border);

            border-radius: 8px;

            font-size: 14px;

            font-family: inherit;

            color: var(--text);

            background: #ffffff;

            outline: none;

        }


        input:focus,
        select:focus,
        textarea:focus {

            border-color: var(--primary);

            box-shadow:
                0 0 0 3px
                rgba(63,107,87,.10);

        }


        textarea {

            min-height: 180px;

            resize: vertical;

        }


        .checkbox {

            display: flex;

            align-items: center;

            gap: 10px;

            margin-top: 5px;

        }


        .checkbox input {

            width: auto;

        }


        .actions {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-top: 30px;

            padding-top: 25px;

            border-top:
                1px solid var(--border);

        }


        .btn {

            display: inline-block;

            padding: 12px 20px;

            border-radius: 8px;

            text-decoration: none;

            border: none;

            cursor: pointer;

            font-size: 14px;

            font-weight: 700;

        }


        .btn-back {

            background: #EDF5EE;

            color: var(--primary);

        }


        .btn-save {

            background: var(--primary);

            color: white;

        }


        .btn:hover {

            opacity: .9;

        }


        @media(max-width:700px) {

            body {

                padding: 20px;

            }


            .form-grid {

                grid-template-columns: 1fr;

            }


            .full {

                grid-column: auto;

            }


            .form-card {

                padding: 20px;

            }


            .actions {

                flex-direction: column;

                gap: 12px;

            }


            .actions .btn {

                width: 100%;

                text-align: center;

            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- HEADER -->

    <div class="header">

        <h1>
            Edit Construction Project
        </h1>

        <p>
            Update project information and save your changes.
        </p>

    </div>



    <!-- FORM -->

    <div class="form-card">

        <form
            method="POST"
            action="{{ url_for('edit_project', project_id=project.id) }}"
        >


            <div class="form-grid">


                <!-- TITLE -->

                <div class="form-group full">

                    <label>
                        Project Title
                    </label>

                    <input
                        type="text"
                        name="title"
                        value="{{ project.title or '' }}"
                        required
                    >

                </div>



                <!-- CATEGORY -->

                <div class="form-group">

                    <label>
                        Category
                    </label>

                    <input
                        type="text"
                        name="category"
                        value="{{ project.category or '' }}"
                        placeholder="Residential, Commercial, etc."
                    >

                </div>



                <!-- LOCATION -->

                <div class="form-group">

                    <label>
                        Location
                    </label>

                    <input
                        type="text"
                        name="location"
                        value="{{ project.location or '' }}"
                    >

                </div>



                <!-- CLIENT -->

                <div class="form-group">

                    <label>
                        Client
                    </label>

                    <input
                        type="text"
                        name="client"
                        value="{{ project.client or '' }}"
                    >

                </div>



                <!-- STATUS -->

                <div class="form-group">

                    <label>
                        Project Status
                    </label>

                    <select name="status">

                        <option
                            value="Upcoming"
                            {% if project.status == "Upcoming" %}
                                selected
                            {% endif %}
                        >
                            Upcoming
                        </option>


                        <option
                            value="Ongoing"
                            {% if project.status == "Ongoing" %}
                                selected
                            {% endif %}
                        >
                            Ongoing
                        </option>


                        <option
                            value="Completed"
                            {% if project.status == "Completed" %}
                                selected
                            {% endif %}
                        >
                            Completed
                        </option>

                    </select>

                </div>



                <!-- START DATE -->

                <div class="form-group">

                    <label>
                        Start Date
                    </label>

                    <input
                        type="date"
                        name="start_date"
                        value="{{ project.start_date or '' }}"
                    >

                </div>



                <!-- COMPLETION DATE -->

                <div class="form-group">

                    <label>
                        Completion Date
                    </label>

                    <input
                        type="date"
                        name="completion_date"
                        value="{{ project.completion_date or '' }}"
                    >

                </div>



                <!-- DESCRIPTION -->

                <div class="form-group full">

                    <label>
                        Project Description
                    </label>

                    <textarea
                        name="description"
                    >{{ project.description or '' }}</textarea>

                </div>



                <!-- FEATURED -->

                <div class="form-group full">

                    <label>
                        Project Visibility
                    </label>

                    <div class="checkbox">

                        <input
                            type="checkbox"
                            name="is_featured"
                            id="is_featured"
                            {% if project.is_featured %}
                                checked
                            {% endif %}
                        >

                        <label
                            for="is_featured"
                            style="margin:0;"
                        >
                            Feature this project on the website
                        </label>

                    </div>

                </div>


            </div>



            <!-- ACTIONS -->

            <div class="actions">


                <a
                    href="{{ url_for('manage_construction_projects') }}"
                    class="btn btn-back"
                >
                    ← Back to Maintenance
                </a>


                <button
                    type="submit"
                    class="btn btn-save"
                >
                    Save Changes
                </button>


            </div>


        </form>

    </div>


</div>


</body>

</html>
